name: Validate antibacterial QSAR
on: [push, pull_request, workflow_dispatch]
jobs:
  qsar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: qsar/requirements.txt
      - run: python -m pip install -r qsar/requirements.txt
      - run: python -m unittest discover -s qsar/tests -v
      - run: python qsar/scripts/validate.py
      - run: python qsar/scripts/predict.py --input qsar/examples/query.csv --output prediction-smoke.csv
      - uses: actions/upload-artifact@v4
        with:
          name: qsar-verified-results
          path: |
            qsar/RESULTS.md
            prediction-smoke.csv
